name: Daily check-in

on:
  schedule:
    # BENST quota window (Beijing 02:02 / 02:12)
    - cron: '2 18 * * *'
    - cron: '12 18 * * *'
    # Full runs (Beijing 06:20 / 09:10 / 13:30)
    - cron: '20 22 * * *'
    - cron: '10 1 * * *'
    - cron: '30 5 * * *'
    # Qoder-only window (Beijing 10:15)
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: 'quota/qoder/morning/midmorning/afternoon/manual'
        type: choice
        options:
          - manual
          - quota
          - qoder
          - morning
          - midmorning
          - afternoon
        default: manual
      platforms:
        description: '逗号分隔平台 key；留空=全量'
        type: string
        default: ''
      dry_run:
        description: '只读模式'
        type: boolean
        default: false

concurrency:
  group: daily-checkin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run unified check-in
        env:
          WB_RT: ${{ secrets.WB_RT }}
          TRAE_CREDS: ${{ secrets.TRAE_CREDS }}
          QODER_CN_TOKEN: ${{ secrets.QODER_CN_TOKEN }}
          QODER_GLOBAL_TOKEN: ${{ secrets.QODER_GLOBAL_TOKEN }}
          MM_CREDS: ${{ secrets.MM_CREDS }}
          LOBSTER_CREDS: ${{ secrets.LOBSTER_CREDS }}
          KK_TOKEN: ${{ secrets.KK_TOKEN }}
          CHECKIN_USERNAME: ${{ secrets.CHECKIN_USERNAME }}
          CHECKIN_PASSWORD: ${{ secrets.CHECKIN_PASSWORD }}
          CHECKIN_USERNAME_DGB: ${{ secrets.CHECKIN_USERNAME_DGB }}
          CHECKIN_PASSWORD_DGB: ${{ secrets.CHECKIN_PASSWORD_DGB }}
          CHECKIN_USERNAME_AIAIAI: ${{ secrets.CHECKIN_USERNAME_AIAIAI }}
          CHECKIN_PASSWORD_AIAIAI: ${{ secrets.CHECKIN_PASSWORD_AIAIAI }}
          CHECKIN_USERNAME_HELPCODER: ${{ secrets.CHECKIN_USERNAME_HELPCODER }}
          CHECKIN_PASSWORD_HELPCODER: ${{ secrets.CHECKIN_PASSWORD_HELPCODER }}
          CHECKIN_USERNAME_KEMENG: ${{ secrets.CHECKIN_USERNAME_KEMENG }}
          CHECKIN_PASSWORD_KEMENG: ${{ secrets.CHECKIN_PASSWORD_KEMENG }}
          SEEKAI_TOKEN: ${{ secrets.SEEKAI_TOKEN }}
          SEEKAI_TURNSTILE_TOKEN: ${{ secrets.SEEKAI_TURNSTILE_TOKEN }}
          BENST_TOKEN: ${{ secrets.BENST_TOKEN }}
          KK_TURNSTILE_TOKEN: ${{ secrets.KK_TURNSTILE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          CHECKIN_GITHUB_REPO: ${{ github.repository }}
          CHECKIN_HISTORY_DIR: history
          CHECKIN_STATE_DIR: state
          KK_HEADLESS: '0'
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          case "$EVENT_SCHEDULE" in
            "2 18 * * *") PROFILE=quota ;;
            "12 18 * * *") PROFILE=quota ;;
            "20 22 * * *") PROFILE=morning ;;
            "10 1 * * *") PROFILE=midmorning ;;
            "15 2 * * *") PROFILE=qoder ;;
            "30 5 * * *") PROFILE=afternoon ;;
            *) PROFILE="${INPUT_PROFILE:-manual}" ;;
          esac
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"

          ARGS=(--profile "$PROFILE")
          if [ -n "${INPUT_PLATFORMS:-}" ]; then
            IFS=',' read -ra PLATFORM_LIST <<< "$INPUT_PLATFORMS"
            for platform in "${PLATFORM_LIST[@]}"; do
              platform="$(echo "$platform" | xargs)"
              if [ -n "$platform" ]; then
                ARGS+=(--platform "$platform")
              fi
            done
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          xvfb-run -a python -m src.main "${ARGS[@]}"

      - name: Upload Turnstile screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: turnstile-timeout
          path: /tmp/turnstile-timeout-*.png
          if-no-files-found: ignore

      - name: Commit logs and state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SUMMARY="$(cat history/last-summary.txt 2>/dev/null || true)"
          git add history/run.log history/events.jsonl history/last-summary.txt state
          git diff --cached --quiet || git commit -m "checkin $(date -u +'%Y-%m-%dT%H:%MZ') ${SUMMARY}"
          git push
